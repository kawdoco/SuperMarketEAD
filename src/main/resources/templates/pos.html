<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>POS Terminal — Sale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root {
            --navy: #0f172a;
            --navy-2: #1e293b;
            --accent: #2563eb;
            --accent-d: #1d4ed8;
            --ok: #16a34a;
            --warn: #d97706;
            --bad: #dc2626;
            --bg: #eef2f7;
            --card: #ffffff;
            --line: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= Top bar ================= */
        header.top {
            background: var(--navy);
            color: #fff;
            padding: 0 1.1rem;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 0 0 auto;
        }
        .brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 700; letter-spacing: 0.2px; font-size: 1.05rem; }
        .brand .logo {
            width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
            display: grid; place-items: center; font-size: 1.1rem;
        }
        .brand small { display: block; font-weight: 500; font-size: 0.68rem; color: #94a3b8; letter-spacing: 0.4px; margin-top: -2px; }
        nav.tabs { display: flex; gap: 0.25rem; margin-left: 1.25rem; height: 100%; }
        nav.tabs a {
            display: flex; align-items: center; gap: 0.45rem; padding: 0 1rem; height: 100%;
            color: #94a3b8; text-decoration: none; font-weight: 600; font-size: 0.92rem;
            border-bottom: 3px solid transparent;
        }
        nav.tabs a:hover { color: #fff; }
        nav.tabs a.active { color: #fff; border-bottom-color: var(--accent); background: rgba(255,255,255,0.05); }
        .spacer { flex: 1 1 auto; }

        .scanner-chip {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.8rem;
            border-radius: 999px; background: var(--navy-2); font-size: 0.8rem; font-weight: 600;
            max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.2s;
        }
        .scanner-chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; box-shadow: 0 0 0 3px rgba(22,163,74,0.25); }
        .scanner-chip.hit { background: #14532d; }
        .scanner-chip.miss { background: #7f1d1d; }
        .scanner-chip.miss .dot { background: var(--bad); box-shadow: 0 0 0 3px rgba(220,38,38,0.25); }
        .clock { text-align: right; line-height: 1.15; }
        .clock .t { font-weight: 700; font-size: 1.05rem; }
        .clock .d { font-size: 0.7rem; color: #94a3b8; }
        .btn-drawer {
            background: transparent; border: 1px solid #475569; color: #e2e8f0; border-radius: 9px;
            padding: 0.42rem 0.8rem; font-weight: 600; font-size: 0.85rem;
        }
        .btn-drawer:hover { background: var(--navy-2); }

        /* ================= KPI strip ================= */
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; padding: 0.75rem 0.9rem 0; flex: 0 0 auto; }
        .kpi {
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0.55rem 0.9rem;
            display: flex; align-items: center; gap: 0.75rem;
        }
        .kpi .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 1.15rem; }
        .kpi .ico.b { background: #dbeafe; color: var(--accent); }
        .kpi .ico.g { background: #dcfce7; color: var(--ok); }
        .kpi .ico.o { background: #fef3c7; color: var(--warn); }
        .kpi .ico.p { background: #ede9fe; color: #7c3aed; }
        .kpi .lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); font-weight: 600; }
        .kpi .val { font-size: 1.2rem; font-weight: 700; line-height: 1.15; }

        /* ================= Main split ================= */
        main { flex: 1 1 auto; display: grid; grid-template-columns: 1fr 410px; gap: 0.75rem; padding: 0.75rem 0.9rem 0.9rem; min-height: 0; }
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-height: 0; }

        /* ---- Catalogue ---- */
        .toolbar { padding: 0.8rem 0.9rem 0.6rem; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
        .search-box { position: relative; }
        .search-box .bi-search { position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.05rem; }
        .search-box .hint {
            position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
            font-size: 0.7rem; font-weight: 600; color: var(--muted); background: #f1f5f9;
            border: 1px solid var(--line); border-radius: 6px; padding: 0.15rem 0.45rem; pointer-events: none;
        }
        .search-box input {
            height: 48px; padding-left: 2.6rem; padding-right: 5.5rem; font-size: 1.02rem;
            border: 2px solid var(--line); border-radius: 11px; background: #f8fafc;
        }
        .search-box input:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }

        .chips { display: flex; gap: 0.4rem; overflow-x: auto; padding-top: 0.65rem; scrollbar-width: thin; }
        .chip {
            flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--muted);
            border-radius: 999px; padding: 0.32rem 0.95rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;
        }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        .catalogue-meta { padding: 0.5rem 0.95rem 0; font-size: 0.78rem; color: var(--muted); flex: 0 0 auto; }
        .catalogue { flex: 1 1 auto; overflow-y: auto; padding: 0.6rem 0.9rem 0.9rem; min-height: 0; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 0.7rem; }
        .p-card {
            position: relative; background: #fff; border: 1px solid var(--line); border-radius: 12px;
            padding: 0.7rem 0.8rem 0.65rem; cursor: pointer; user-select: none; display: flex; flex-direction: column;
            transition: border-color 0.12s, box-shadow 0.12s, transform 0.06s;
        }
        .p-card:hover { border-color: #93c5fd; box-shadow: 0 4px 14px rgba(15,23,42,0.08); }
        .p-card:active { transform: scale(0.975); }
        .p-card.out-of-stock { opacity: 0.5; cursor: not-allowed; }
        .p-cat { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; color: var(--accent); }
        .p-name { font-weight: 600; font-size: 0.95rem; line-height: 1.25; margin: 0.15rem 0 0.2rem; min-height: 2.4em; }
        .p-code { font-size: 0.7rem; color: var(--muted); font-family: Consolas, monospace; }
        .p-foot { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 0.55rem; }
        .p-price { font-size: 1.15rem; font-weight: 700; }
        .p-price::before { content: "$"; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-right: 1px; }
        .p-stock { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 999px; }
        .p-stock.ok { background: #dcfce7; color: #166534; }
        .p-stock.low { background: #fef3c7; color: #92400e; }
        .p-stock.none { background: #fee2e2; color: #991b1b; }
        .p-card .add-btn {
            position: absolute; top: 0.55rem; right: 0.55rem; width: 28px; height: 28px; border-radius: 8px;
            border: none; background: #eff6ff; color: var(--accent); display: grid; place-items: center; padding: 0;
        }
        .p-card:hover .add-btn { background: var(--accent); color: #fff; }
        .grid-empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 3rem 0; }
        .grid-empty i { font-size: 2rem; }

        /* ---- Cart ---- */
        .cart-head { padding: 0.85rem 1rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; }
        .cart-head h5 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .cart-head .count { background: var(--navy); color: #fff; border-radius: 999px; font-size: 0.72rem; padding: 0.1rem 0.55rem; }
        .cart-list { flex: 1 1 auto; overflow-y: auto; padding: 0.4rem 0.9rem; min-height: 0; }
        .cart-empty { text-align: center; color: var(--muted); padding: 3.2rem 1rem; }
        .cart-empty i { font-size: 2.4rem; opacity: 0.6; }
        .cart-item { padding: 0.65rem 0; border-bottom: 1px dashed var(--line); }
        .cart-item:last-child { border-bottom: none; }
        .cart-item .name { font-weight: 600; font-size: 0.9rem; line-height: 1.25; }
        .cart-item .meta { font-size: 0.72rem; color: var(--muted); }
        .cart-item .line-total { font-weight: 700; white-space: nowrap; }
        .cart-item.flash { animation: flash 0.7s ease-out; }
        @keyframes flash { from { background: #dbeafe; } to { background: transparent; } }
        .qty-row { display: flex; align-items: center; gap: 0.3rem; }
        .qty-row button {
            width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
            background: #fff; font-size: 1.05rem; line-height: 1; color: var(--text);
        }
        .qty-row button:hover { background: #f1f5f9; }
        .qty-row input { width: 50px; height: 34px; text-align: center; border: 1px solid var(--line); border-radius: 9px; font-weight: 600; }
        .qty-row .unit { font-size: 0.72rem; color: var(--muted); margin-left: 0.5rem; }
        .rm-btn { border: none; background: transparent; color: #94a3b8; font-size: 1.05rem; padding: 0.25rem 0.4rem; border-radius: 8px; }
        .rm-btn:hover { color: var(--bad); background: #fee2e2; }

        .cart-foot { flex: 0 0 auto; padding: 0.8rem 1rem 1rem; border-top: 1px solid var(--line); background: #f8fafc; border-radius: 0 0 14px 14px; }
        .sum-row { display: flex; justify-content: space-between; padding: 0.12rem 0; font-size: 0.92rem; color: var(--muted); }
        .sum-row.total { color: var(--text); font-size: 1.55rem; font-weight: 800; padding-top: 0.45rem; margin-top: 0.3rem; border-top: 2px solid var(--navy); }
        .btn-charge {
            width: 100%; margin-top: 0.7rem; height: 58px; border: none; border-radius: 12px;
            background: var(--accent); color: #fff; font-size: 1.15rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        }
        .btn-charge:hover:not(:disabled) { background: var(--accent-d); }
        .btn-charge:disabled { background: #cbd5e1; cursor: not-allowed; }
        .btn-charge kbd { background: rgba(255,255,255,0.2); color: #fff; border-radius: 6px; font-size: 0.7rem; padding: 0.1rem 0.4rem; }

        /* ================= Payment modal ================= */
        .modal-content { border: none; border-radius: 16px; overflow: hidden; }
        .pay-total { background: var(--navy); color: #fff; padding: 1.1rem 1.5rem; text-align: center; }
        .pay-total .l { font-size: 0.72rem; letter-spacing: 1px; text-transform: uppercase; color: #94a3b8; }
        .pay-total .v { font-size: 2.6rem; font-weight: 800; line-height: 1.1; }
        .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .seg input { display: none; }
        .seg label {
            border: 2px solid var(--line); border-radius: 12px; padding: 0.75rem; text-align: center;
            font-weight: 700; cursor: pointer; color: var(--muted);
        }
        .seg input:checked + label { border-color: var(--accent); background: #eff6ff; color: var(--accent); }
        .quick-cash { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
        .quick-cash button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 0.4rem 0.8rem; font-weight: 600; font-size: 0.9rem; }
        .quick-cash button:hover { border-color: var(--accent); color: var(--accent); }
        .change-box { margin-top: 0.8rem; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; }
        .change-box .l { font-size: 0.8rem; color: #166534; font-weight: 600; }
        .change-box .v { font-size: 1.5rem; font-weight: 800; color: #166534; }
        .change-box.short { background: #fef2f2; border-color: #fecaca; }
        .change-box.short .l, .change-box.short .v { color: #991b1b; }

        .done-view { text-align: center; padding: 2rem 1.5rem 1.5rem; }
        .done-view .tick { width: 72px; height: 72px; border-radius: 50%; background: #dcfce7; color: var(--ok); display: grid; place-items: center; font-size: 2.4rem; margin: 0 auto 0.8rem; }
        .done-view .chg { font-size: 2.2rem; font-weight: 800; color: var(--ok); }

        .toast-pos {
            position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(10px);
            background: var(--navy); color: #fff; padding: 0.7rem 1.3rem; border-radius: 11px;
            font-size: 0.92rem; z-index: 2000; opacity: 0; transition: opacity 0.2s, transform 0.2s;
            pointer-events: none; max-width: 90vw; text-align: center; box-shadow: 0 8px 24px rgba(15,23,42,0.3);
        }
        .toast-pos.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-pos.err { background: #991b1b; }

        @media (max-width: 1100px) {
            main { grid-template-columns: 1fr 360px; }
            .kpis { grid-template-columns: repeat(2, 1fr); }
            .clock { display: none; }
        }

        /* ================= 800 x 600 terminal screen =================
           Fixed two-pane layout, no page scrolling: only the product
           catalogue and the cart list scroll internally. */
        html, body { width: 100%; height: 100%; }
        @media (max-width: 900px) {
            body { height: 100vh; overflow: hidden; }
            header.top { height: 44px; padding: 0 0.6rem; gap: 0.5rem; }
            .brand { font-size: 0.9rem; gap: 0.4rem; }
            .brand .logo { width: 28px; height: 28px; font-size: 0.95rem; }
            .brand small { display: none; }
            nav.tabs { margin-left: 0.4rem; }
            nav.tabs a { padding: 0 0.6rem; font-size: 0.82rem; }
            nav.tabs a span { display: inline; }
            .scanner-chip { max-width: 130px; padding: 0.25rem 0.55rem; font-size: 0.72rem; }
            .btn-drawer { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
            .clock { display: block; }
            .clock .t { font-size: 0.9rem; }
            .clock .d { display: none; }

            .kpis { grid-template-columns: repeat(4, 1fr); gap: 0.4rem; padding: 0.4rem 0.5rem 0; }
            .kpi { padding: 0.3rem 0.5rem; gap: 0.4rem; border-radius: 9px; }
            .kpi .ico { width: 26px; height: 26px; font-size: 0.85rem; border-radius: 7px; }
            .kpi .lbl { font-size: 0.56rem; letter-spacing: 0.3px; }
            .kpi .val { font-size: 0.92rem; }

            main { grid-template-columns: 1fr 290px; gap: 0.45rem; padding: 0.4rem 0.5rem 0.5rem; }
            .panel { border-radius: 10px; }
            .toolbar { padding: 0.45rem 0.55rem 0.4rem; }
            .search-box input { height: 38px; font-size: 0.9rem; padding-right: 3.5rem; }
            .search-box .hint { display: none; }
            .chips { padding-top: 0.4rem; }
            .chip { padding: 0.2rem 0.65rem; font-size: 0.75rem; }
            .catalogue-meta { padding: 0.3rem 0.6rem 0; font-size: 0.7rem; }
            .catalogue { padding: 0.4rem 0.55rem 0.55rem; max-height: none; }
            .product-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 0.4rem; }
            .p-card { padding: 0.45rem 0.55rem; border-radius: 9px; }
            .p-name { font-size: 0.8rem; min-height: 2.3em; }
            .p-code { display: none; }
            .p-foot { margin-top: 0.3rem; }
            .p-price { font-size: 0.98rem; }
            .p-stock { font-size: 0.6rem; padding: 0.1rem 0.4rem; }
            .p-card .add-btn { width: 22px; height: 22px; top: 0.35rem; right: 0.35rem; }

            .cart-head { padding: 0.45rem 0.65rem; }
            .cart-head h5 { font-size: 0.88rem; }
            .cart-list { padding: 0.2rem 0.6rem; }
            .cart-empty { padding: 1.5rem 0.5rem; }
            .cart-item { padding: 0.4rem 0; }
            .cart-item .name { font-size: 0.8rem; }
            .qty-row button { width: 28px; height: 28px; }
            .qty-row input { width: 40px; height: 28px; }
            .cart-foot { padding: 0.45rem 0.65rem 0.55rem; }
            .sum-row { font-size: 0.8rem; padding: 0.05rem 0; }
            .sum-row.total { font-size: 1.2rem; padding-top: 0.25rem; margin-top: 0.15rem; }
            .btn-charge { height: 46px; margin-top: 0.4rem; font-size: 1rem; border-radius: 10px; }

            .modal-dialog { margin: 0.5rem auto; max-width: 440px; }
            .pay-total { padding: 0.6rem 1rem; }
            .pay-total .v { font-size: 2rem; }
            .modal-body.p-4 { padding: 0.75rem 1rem !important; }
            .modal-footer.px-4 { padding: 0 1rem 0.75rem !important; }
            .seg label { padding: 0.45rem; }
            .done-view { padding: 1rem; }
            .done-view .tick { width: 54px; height: 54px; font-size: 1.8rem; margin-bottom: 0.5rem; }
        }
    </style>
</head>
<body>

<!-- ================= Top bar ================= -->
<header class="top">
    <div class="brand">
        <div class="logo"><i class="bi bi-receipt-cutoff"></i></div>
        <div>POS Terminal<small>TERMINAL POS-1</small></div>
    </div>
    <nav class="tabs">
        <a class="active" href="/pos"><i class="bi bi-shop"></i><span>Sale</span></a>
        <a href="/inventory"><i class="bi bi-boxes"></i><span>Inventory</span></a>
        <a href="/reports"><i class="bi bi-graph-up-arrow"></i><span>Reports</span></a>
    </nav>
    <div class="spacer"></div>
    <div class="scanner-chip" id="scannerChip" title="USB barcode scanner — scan anywhere on this screen">
        <span class="dot"></span><span id="scannerText">Scanner ready</span>
    </div>
    <button type="button" class="btn-drawer" id="drawerBtn" title="Open cash drawer (no sale)">
        <i class="bi bi-inboxes"></i> Drawer
    </button>
    <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
</header>

<!-- ================= KPI strip ================= -->
<section class="kpis">
    <div class="kpi"><div class="ico g"><i class="bi bi-currency-dollar"></i></div>
        <div><div class="lbl">Sales today</div>
            <div class="val" id="kpiSales" th:attr="data-v=${salesToday}"
                 th:text="'$' + ${#numbers.formatDecimal(salesToday, 1, 2)}">$0.00</div></div></div>
    <div class="kpi"><div class="ico b"><i class="bi bi-receipt"></i></div>
        <div><div class="lbl">Orders today</div>
            <div class="val" id="kpiOrders" th:attr="data-v=${ordersToday}" th:text="${ordersToday}">0</div></div></div>
    <div class="kpi"><div class="ico p"><i class="bi bi-cart3"></i></div>
        <div><div class="lbl">Items in cart</div><div class="val" id="kpiCart">0</div></div></div>
    <div class="kpi"><div class="ico o"><i class="bi bi-exclamation-triangle"></i></div>
        <div><div class="lbl">Low stock</div><div class="val" th:text="${lowStockCount}">0</div></div></div>
</section>

<main>
    <!-- ================= Catalogue ================= -->
    <section class="panel">
        <div class="toolbar">
            <div class="search-box">
                <i class="bi bi-search"></i>
                <input type="text" id="productSearch" class="form-control"
                       placeholder="Search inventory by name, barcode or category…" autocomplete="off">
                <span class="hint">F2</span>
            </div>
            <div class="chips" id="chips">
                <button type="button" class="chip active" data-cat="">All</button>
                <button type="button" class="chip" th:each="c : ${allCategories}"
                        th:attr="data-cat=${c}" th:text="${c}">Category</button>
            </div>
        </div>
        <div class="catalogue-meta"><span id="resultCount">0</span> products</div>
        <div class="catalogue" id="productGrid"><!-- /api/products fragment lands here --></div>
    </section>

    <!-- ================= Cart ================= -->
    <section class="panel">
        <div class="cart-head">
            <h5><i class="bi bi-cart4"></i> Current sale <span class="count" id="cartCount">0</span></h5>
            <button class="btn btn-sm btn-outline-danger" id="clearCartBtn" disabled>
                <i class="bi bi-x-lg"></i> Clear
            </button>
        </div>

        <div class="cart-list" id="cartList"></div>

        <div class="cart-foot">
            <div class="sum-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <div class="sum-row"><span>Tax (10%)</span><span id="tax">$0.00</span></div>
            <div class="sum-row total"><span>Total</span><span id="total">$0.00</span></div>
            <button class="btn-charge" id="checkoutBtn" disabled>
                <i class="bi bi-credit-card-2-front"></i> Charge <kbd>F9</kbd>
            </button>
        </div>
    </section>
</main>

<!-- ================= Payment modal ================= -->
<div class="modal fade" id="checkoutModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div id="payView">
                <div class="pay-total">
                    <div class="l">Amount due</div>
                    <div class="v" id="payTotal">$0.00</div>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="customerName">Customer (optional)</label>
                        <input type="text" class="form-control" id="customerName" placeholder="Walk-in">
                    </div>

                    <div class="seg mb-3">
                        <input type="radio" name="paymentMethod" id="payCash" value="CASH" checked>
                        <label for="payCash"><i class="bi bi-cash-coin"></i> Cash</label>
                        <input type="radio" name="paymentMethod" id="payCard" value="CARD">
                        <label for="payCard"><i class="bi bi-credit-card"></i> Card</label>
                    </div>

                    <div id="cashTenderRow">
                        <label class="form-label small fw-semibold" for="cashTendered">Cash tendered</label>
                        <input type="number" class="form-control form-control-lg text-end fw-bold" id="cashTendered"
                               placeholder="0.00" min="0" step="0.01" inputmode="decimal">
                        <div class="quick-cash" id="quickCash"></div>
                        <div class="change-box" id="changeBox">
                            <span class="l" id="changeLabel">Change due</span>
                            <span class="v" id="changeDue">$0.00</span>
                        </div>
                    </div>

                    <div id="cardLast4Row" style="display:none;">
                        <label class="form-label small fw-semibold" for="cardLastFour">Card last 4 digits</label>
                        <input type="text" class="form-control form-control-lg" id="cardLastFour" maxlength="4"
                               placeholder="e.g. 4242" inputmode="numeric">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0 px-4 pb-4">
                    <button type="button" class="btn btn-light btn-lg" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success btn-lg flex-fill fw-bold" id="confirmCheckout">
                        <i class="bi bi-check2-circle"></i> Finalize bill
                    </button>
                </div>
            </div>

            <div id="doneView" class="done-view" style="display:none;">
                <div class="tick"><i class="bi bi-check-lg"></i></div>
                <h4 class="fw-bold mb-1" id="doneTitle">Order complete</h4>
                <div class="text-muted mb-3" id="doneSub"></div>
                <div id="doneChangeWrap" style="display:none;">
                    <div class="small text-muted">Change due</div>
                    <div class="chg" id="doneChange">$0.00</div>
                </div>
                <div class="small mt-3" id="doneDrawer"></div>
                <button type="button" class="btn btn-primary btn-lg w-100 mt-4 fw-bold" id="newSaleBtn">
                    <i class="bi bi-plus-circle"></i> New sale
                </button>
            </div>

        </div>
    </div>
</div>

<div class="toast-pos" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    "use strict";

    // ---------- State ----------
    var cart = [];                 // [{barcode, name, category, price, quantity, stock}]
    var filters = { category: "", q: "" };
    var TAX_RATE = 0.10;
    var searchTimer = null;
    var modalOpen = false;
    var saleDone = false;
    var lastRenderedBarcode = null;

    // ---------- Elements ----------
    var $ = function (id) { return document.getElementById(id); };
    var grid = $("productGrid"), searchInput = $("productSearch"), resultCount = $("resultCount");
    var chips = $("chips");
    var cartList = $("cartList"), cartCount = $("cartCount"), kpiCart = $("kpiCart");
    var subtotalEl = $("subtotal"), taxEl = $("tax"), totalEl = $("total");
    var checkoutBtn = $("checkoutBtn"), clearCartBtn = $("clearCartBtn");
    var modalEl = $("checkoutModal"), modal = new bootstrap.Modal(modalEl);
    var payCash = $("payCash"), payCard = $("payCard");
    var cashTenderRow = $("cashTenderRow"), cardLast4Row = $("cardLast4Row");
    var cashTendered = $("cashTendered"), changeDue = $("changeDue");
    var changeBox = $("changeBox"), changeLabel = $("changeLabel");
    var cardLastFour = $("cardLastFour"), quickCash = $("quickCash");
    var toast = $("toast");
    var chip = $("scannerChip"), chipText = $("scannerText");

    function money(n) { return "$" + (Math.round(n * 100) / 100).toFixed(2); }

    // ---------- Clock ----------
    function tick() {
        var d = new Date();
        $("clockT").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        $("clockD").textContent = d.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short", year: "numeric" });
    }
    tick(); setInterval(tick, 20000);

    // ---------- Sound (WebAudio; silent if unavailable) ----------
    var audioCtx = null;
    function beep(ok) {
        try {
            audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            var o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = "square"; o.frequency.value = ok ? 1100 : 220;
            g.gain.value = 0.06;
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); o.stop(audioCtx.currentTime + (ok ? 0.09 : 0.32));
        } catch (e) { /* no audio, ignore */ }
    }

    // ---------- Catalogue (search runs against the inventory in SQLite) ----------
    function loadProducts() {
        var params = new URLSearchParams();
        if (filters.category) params.set("category", filters.category);
        if (filters.q) params.set("q", filters.q);

        fetch("/api/products?" + params.toString())
            .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
            .then(function (html) {
                grid.innerHTML = html;
                resultCount.textContent = grid.querySelectorAll(".p-card").length;
            })
            .catch(function (err) { showToast("Failed to load products: " + err.message, true); });
    }

    // Product tile click (event delegation: survives grid refreshes)
    grid.addEventListener("click", function (e) {
        var card = e.target.closest(".p-card");
        if (!card) return;
        var btn = card.querySelector(".add-btn");
        if (!btn || btn.disabled) { showToast("Out of stock", true); return; }
        addProduct({
            barcode: btn.dataset.barcode,
            name: btn.dataset.name,
            category: btn.dataset.category,
            price: parseFloat(btn.dataset.price) || 0,
            stock: parseInt(btn.dataset.stock, 10) || 0
        });
    });

    chips.addEventListener("click", function (e) {
        var c = e.target.closest(".chip");
        if (!c) return;
        chips.querySelectorAll(".chip").forEach(function (x) { x.classList.remove("active"); });
        c.classList.add("active");
        filters.category = c.dataset.cat;
        loadProducts();
    });

    searchInput.addEventListener("input", function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
            filters.q = searchInput.value.trim();
            loadProducts();
        }, 200);
    });

    // Typed / pasted search + Enter: exact barcode first, otherwise single match.
    searchInput.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        var q = searchInput.value.trim();
        if (!q) return;
        lookupBarcode(q, function (found) {
            if (found) { clearSearch(); return; }
            fetch("/api/products?q=" + encodeURIComponent(q))
                .then(function (r) { return r.text(); })
                .then(function (html) {
                    var tmp = document.createElement("div");
                    tmp.innerHTML = html;
                    var cards = tmp.querySelectorAll(".add-btn:not([disabled])");
                    if (cards.length === 1) {
                        var b = cards[0];
                        addProduct({ barcode: b.dataset.barcode, name: b.dataset.name, category: b.dataset.category,
                                     price: parseFloat(b.dataset.price) || 0, stock: parseInt(b.dataset.stock, 10) || 0 });
                        clearSearch();
                    } else if (cards.length === 0) {
                        beep(false); showToast("No product matches \"" + q + "\"", true);
                    } else {
                        showToast(cards.length + " matches — tap the product to add");
                    }
                });
        }, true);
    });

    function clearSearch() { searchInput.value = ""; filters.q = ""; loadProducts(); }

    // ---------- Barcode scanner ----------
    // USB/Bluetooth scanners act as a keyboard: they "type" the code very fast and
    // finish with Enter. We watch the whole page for that pattern, so the cashier
    // never has to click a field first.
    var SCAN_GAP_MS = 50;      // max gap between two characters of one scan
    var SCAN_MIN_LEN = 3;
    var scanBuf = "", scanLast = 0, chipTimer = null;

    document.addEventListener("keydown", function (e) {
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        var now = Date.now();

        if (e.key === "Enter") {
            if (scanBuf.length >= SCAN_MIN_LEN && now - scanLast <= SCAN_GAP_MS * 3) {
                var code = scanBuf;
                scanBuf = "";
                e.preventDefault();
                e.stopPropagation();
                stripFromFocused(code);
                if (modalOpen) { return; }          // never add items while paying
                handleScan(code);
            }
            scanBuf = "";
            return;
        }

        if (e.key.length === 1) {
            if (now - scanLast > SCAN_GAP_MS) scanBuf = "";   // human-speed typing: start over
            scanBuf += e.key;
            scanLast = now;
        }
    }, true);

    // The scanner's characters also land in whatever input has focus; remove them.
    function stripFromFocused(code) {
        var el = document.activeElement;
        if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && typeof el.value === "string"
                && el.value.length >= code.length && el.value.slice(-code.length) === code) {
            el.value = el.value.slice(0, -code.length);
        }
    }

    function handleScan(code) {
        lookupBarcode(code, function (found) {
            if (!found) {
                beep(false);
                setChip("miss", "Not found: " + code);
                showToast("Barcode " + code + " is not in the inventory", true);
            }
        }, false);
    }

    function lookupBarcode(code, done, quiet) {
        fetch("/api/products/barcode/" + encodeURIComponent(code))
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (p) {
                if (p) {
                    var ok = addProduct({
                        barcode: p.barcode, name: p.name, category: p.category,
                        price: parseFloat(p.price) || 0, stock: p.stock || 0
                    });
                    if (ok) setChip("hit", p.name);
                    done(true);
                } else {
                    done(false);
                }
            })
            .catch(function () { showToast("Scanner lookup failed", true); done(true); });
    }

    function setChip(state, text) {
        chip.classList.remove("hit", "miss");
        if (state) chip.classList.add(state);
        chipText.textContent = text;
        clearTimeout(chipTimer);
        chipTimer = setTimeout(function () {
            chip.classList.remove("hit", "miss");
            chipText.textContent = "Scanner ready";
        }, 2500);
    }

    // ---------- Cart ----------
    function addProduct(item) {
        if (item.stock <= 0) {
            beep(false);
            showToast(item.name + " is out of stock", true);
            return false;
        }
        var existing = cart.find(function (i) { return i.barcode === item.barcode; });
        if (existing) {
            if (existing.quantity >= item.stock) {
                beep(false);
                showToast("Only " + item.stock + " in stock for " + existing.name, true);
                return false;
            }
            existing.quantity += 1;
            existing.stock = item.stock;
        } else {
            cart.push({ barcode: item.barcode, name: item.name, category: item.category,
                        price: item.price, quantity: 1, stock: item.stock });
        }
        beep(true);
        lastRenderedBarcode = item.barcode;
        renderCart();
        return true;
    }

    function removeItem(barcode) { cart = cart.filter(function (i) { return i.barcode !== barcode; }); renderCart(); }
    function clearCart() { cart = []; renderCart(); }

    function cartTotals() {
        var subtotal = cart.reduce(function (s, i) { return s + i.price * i.quantity; }, 0);
        var tax = subtotal * TAX_RATE;
        return { subtotal: subtotal, tax: tax, total: subtotal + tax };
    }

    function renderCart() {
        var units = cart.reduce(function (n, i) { return n + i.quantity; }, 0);
        clearCartBtn.disabled = cart.length === 0;
        cartCount.textContent = String(units);
        kpiCart.textContent = String(units);

        if (cart.length === 0) {
            cartList.innerHTML =
                '<div class="cart-empty"><i class="bi bi-upc-scan"></i>' +
                '<p class="mt-2 mb-0">Scan a barcode or tap a product</p></div>';
            checkoutBtn.disabled = true;
        } else {
            cartList.innerHTML = cart.map(function (item) {
                var bc = escapeHtml(item.barcode);
                var cls = item.barcode === lastRenderedBarcode ? " flash" : "";
                return '' +
                    '<div class="cart-item' + cls + '">' +
                    '  <div class="d-flex justify-content-between gap-2">' +
                    '    <div><div class="name">' + escapeHtml(item.name) + '</div>' +
                    '    <div class="meta">' + escapeHtml(item.category) + ' &middot; ' + bc + ' &middot; ' + money(item.price) + ' ea</div></div>' +
                    '    <div class="line-total">' + money(item.price * item.quantity) + '</div>' +
                    '  </div>' +
                    '  <div class="d-flex justify-content-between align-items-center mt-2">' +
                    '    <div class="qty-row">' +
                    '      <button type="button" data-action="dec" data-barcode="' + bc + '">&minus;</button>' +
                    '      <input type="number" min="1" value="' + item.quantity + '" data-action="set" data-barcode="' + bc + '">' +
                    '      <button type="button" data-action="inc" data-barcode="' + bc + '">+</button>' +
                    '    </div>' +
                    '    <button type="button" class="rm-btn" data-action="rm" data-barcode="' + bc + '" title="Remove"><i class="bi bi-trash3"></i></button>' +
                    '  </div>' +
                    '</div>';
            }).join("");
            checkoutBtn.disabled = false;
            var flashed = cartList.querySelector(".flash");
            if (flashed) flashed.scrollIntoView({ block: "nearest" });
        }
        lastRenderedBarcode = null;

        var t = cartTotals();
        subtotalEl.textContent = money(t.subtotal);
        taxEl.textContent = money(t.tax);
        totalEl.textContent = money(t.total);
    }

    // Cart row actions (delegated)
    cartList.addEventListener("click", function (e) {
        var el = e.target.closest("[data-action]");
        if (!el || el.tagName === "INPUT") return;
        var bc = el.dataset.barcode;
        var item = cart.find(function (i) { return i.barcode === bc; });
        if (!item) return;
        switch (el.dataset.action) {
            case "inc":
                if (item.quantity >= item.stock) { showToast("Only " + item.stock + " in stock", true); return; }
                item.quantity += 1; break;
            case "dec": item.quantity = Math.max(1, item.quantity - 1); break;
            case "rm": removeItem(bc); return;
        }
        renderCart();
    });
    cartList.addEventListener("change", function (e) {
        var el = e.target;
        if (el.dataset.action !== "set") return;
        var item = cart.find(function (i) { return i.barcode === el.dataset.barcode; });
        if (!item) return;
        var q = Math.max(1, Math.floor(parseInt(el.value, 10)) || 1);
        if (q > item.stock) { q = item.stock; showToast("Only " + item.stock + " in stock", true); }
        item.quantity = q;
        renderCart();
    });

    clearCartBtn.addEventListener("click", clearCart);

    // ---------- Checkout ----------
    function openCheckout() {
        if (cart.length === 0 || modalOpen) return;
        var t = cartTotals().total;
        $("payTotal").textContent = money(t);
        $("payView").style.display = "block";
        $("doneView").style.display = "none";
        saleDone = false;
        payCash.checked = true;
        cashTendered.value = "";
        cardLastFour.value = "";
        buildQuickCash(t);
        updateMethodRows();
        updateChange();
        modal.show();
    }
    checkoutBtn.addEventListener("click", openCheckout);

    modalEl.addEventListener("shown.bs.modal", function () { modalOpen = true; if (payCash.checked) cashTendered.focus(); });
    modalEl.addEventListener("hidden.bs.modal", function () { modalOpen = false; });

    function buildQuickCash(total) {
        var opts = [total];
        [5, 10, 20, 50, 100, 500, 1000].forEach(function (step) {
            var v = Math.ceil(total / step) * step;
            if (v > total && opts.indexOf(v) === -1) opts.push(v);
        });
        quickCash.innerHTML = opts.slice(0, 5).map(function (v, i) {
            return '<button type="button" data-amt="' + v.toFixed(2) + '">' + (i === 0 ? "Exact " : "") + money(v) + '</button>';
        }).join("");
    }
    quickCash.addEventListener("click", function (e) {
        var b = e.target.closest("button");
        if (!b) return;
        cashTendered.value = b.dataset.amt;
        updateChange();
    });

    payCash.addEventListener("change", function () { updateMethodRows(); cashTendered.focus(); });
    payCard.addEventListener("change", function () { updateMethodRows(); cardLastFour.focus(); });
    cashTendered.addEventListener("input", updateChange);

    function updateMethodRows() {
        cashTenderRow.style.display = payCash.checked ? "block" : "none";
        cardLast4Row.style.display = payCard.checked ? "block" : "none";
    }

    function updateChange() {
        var t = cartTotals().total;
        var tender = parseFloat(cashTendered.value);
        if (isNaN(tender)) { changeBox.classList.remove("short"); changeLabel.textContent = "Change due"; changeDue.textContent = money(0); return; }
        if (tender + 0.001 < t) {
            changeBox.classList.add("short");
            changeLabel.textContent = "Still owed";
            changeDue.textContent = money(t - tender);
        } else {
            changeBox.classList.remove("short");
            changeLabel.textContent = "Change due";
            changeDue.textContent = money(tender - t);
        }
    }

    // Enter inside the modal finalizes the bill (or starts the next sale once done)
    modalEl.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (saleDone) { finishSale(); } else { $("confirmCheckout").click(); }
    });

    $("confirmCheckout").addEventListener("click", function () {
        var t = cartTotals().total;

        if (payCash.checked) {
            var tender = parseFloat(cashTendered.value);
            if (isNaN(tender) || tender + 0.001 < t) {
                showToast("Cash tendered must cover the total of " + money(t), true);
                return;
            }
        }
        if (payCard.checked && !/^\d{4}$/.test(cardLastFour.value.trim())) {
            showToast("Enter the card's last 4 digits", true);
            return;
        }

        var payload = {
            customerName: $("customerName").value.trim() || null,
            paymentMethod: payCash.checked ? "CASH" : "CARD",
            cashTendered: payCash.checked ? parseFloat(cashTendered.value) : null,
            cardLastFour: payCard.checked ? cardLastFour.value.trim() : null,
            terminal: "POS-1",
            items: cart.map(function (i) {
                return { barcode: i.barcode, name: i.name, category: i.category,
                         unitPrice: i.price, quantity: i.quantity,
                         lineTotal: +(i.price * i.quantity).toFixed(2) };
            })
        };

        var btn = $("confirmCheckout");
        btn.disabled = true;

        fetch("/api/checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
            btn.disabled = false;
            if (!res.ok || res.data.error) { showToast(res.data.error || "Checkout failed", true); return; }
            showDone(res.data);
        })
        .catch(function (err) { btn.disabled = false; showToast("Checkout failed: " + err.message, true); });
    });

    function showDone(d) {
        saleDone = true;
        $("doneTitle").textContent = "Order #" + d.orderId + " complete";
        $("doneSub").textContent = money(parseFloat(d.total)) + " · " +
            d.paymentMethod + (d.cardLastFour ? " ****" + d.cardLastFour : "");
        var hasChange = d.paymentMethod === "CASH" && d.remaining != null;
        $("doneChangeWrap").style.display = hasChange ? "block" : "none";
        if (hasChange) $("doneChange").textContent = money(parseFloat(d.remaining));
        $("doneDrawer").innerHTML = d.drawerOpened
            ? '<span class="text-success"><i class="bi bi-unlock-fill"></i> Cash drawer unlocked</span>'
            : '<span class="text-muted"><i class="bi bi-lock"></i> Drawer not triggered (hardware off or no printer found)</span>';

        // headline numbers
        var sales = $("kpiSales"), orders = $("kpiOrders");
        sales.dataset.v = (parseFloat(sales.dataset.v) || 0) + parseFloat(d.total);
        sales.textContent = money(parseFloat(sales.dataset.v));
        orders.dataset.v = (parseInt(orders.dataset.v, 10) || 0) + 1;
        orders.textContent = orders.dataset.v;

        clearCart();
        $("payView").style.display = "none";
        $("doneView").style.display = "block";
        loadProducts();               // refresh stock levels
        $("newSaleBtn").focus();
    }

    function finishSale() { modal.hide(); $("customerName").value = ""; searchInput.focus(); }
    $("newSaleBtn").addEventListener("click", finishSale);

    // ---------- Drawer (manual, no sale) ----------
    $("drawerBtn").addEventListener("click", function () {
        fetch("/api/drawer/open", { method: "POST" })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                if (d.opened) showToast("Cash drawer opened");
                else showToast(d.hardwareEnabled ? "Drawer did not respond — check the printer" : "Hardware is disabled (demo mode)", true);
            })
            .catch(function () { showToast("Could not reach the drawer", true); });
    });

    // ---------- Shortcuts ----------
    document.addEventListener("keydown", function (e) {
        if (e.key === "F2") { e.preventDefault(); if (!modalOpen) { searchInput.focus(); searchInput.select(); } }
        if (e.key === "F9") { e.preventDefault(); openCheckout(); }
    });

    // ---------- Helpers ----------
    function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
    }

    var toastTimer = null;
    function showToast(msg, isErr) {
        toast.textContent = msg;
        toast.classList.toggle("err", !!isErr);
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 3000);
    }

    // ---------- Boot ----------
    renderCart();
    loadProducts();
})();
</script>
</body>
</html>
