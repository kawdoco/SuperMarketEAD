<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POS Terminal — Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body { background: #f1f3f4; }
        header.top {
            background: #fff; border-bottom: 1px solid #e0e0e0;
            padding: 0.5rem 1rem; display: flex; align-items: center; gap: 0.75rem;
        }
        header.top .brand { font-weight: 700; color: #1a73e8; }
        header.top .spacer { flex: 1 1 auto; }
        header.top .nav-link { text-decoration: none; color: #5f6368; font-weight: 600; padding: 0.4rem 0.7rem; border-radius: 8px; }
        header.top .nav-link.active, header.top .nav-link:hover { background: #e8f0fe; color: #1a73e8; }
        .stock-badge.low { background: #fce8e6; color: #c5221f; }
        .stock-badge.ok { background: #e6f4ea; color: #137333; }
    </style>
</head>
<body>

<header class="top mb-3">
    <span class="brand"><i class="bi bi-cash-stack"></i> POS Terminal</span>
    <div class="spacer"></div>
    <a class="nav-link" href="/pos"><i class="bi bi-shop"></i> Sale</a>
    <a class="nav-link active" href="/inventory"><i class="bi bi-boxes"></i> Inventory</a>
    <a class="nav-link" href="/reports"><i class="bi bi-graph-up"></i> Reports</a>
</header>

<div class="container-fluid px-2">

    <!-- Flash messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${success}">ok</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}">err</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <!-- ============ Product form (create / edit) ============ -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-white fw-bold">
                    <i class="bi bi-plus-square"></i>
                    <span th:text="${form.id != null} ? 'Edit product #' + ${form.id} : 'New product'">New product</span>
                </div>
                <div class="card-body">
                    <form th:action="@{/inventory/save}" th:object="${form}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-2">
                            <label class="form-label small mb-1">Barcode / SKU *</label>
                            <input type="text" class="form-control" th:field="*{barcode}" required maxlength="64"
                                   placeholder="e.g. 4006381333931">
                        </div>

                        <div class="mb-2">
                            <label class="form-label small mb-1">Name *</label>
                            <input type="text" class="form-control" th:field="*{name}" required maxlength="128">
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-7">
                                <label class="form-label small mb-1">Category *</label>
                                <input type="text" class="form-control" th:field="*{category}" required maxlength="64"
                                       list="categoryList" placeholder="e.g. Beverages">
                                <datalist id="categoryList">
                                    <option th:each="c : ${categories}" th:value="${c}">
                                </datalist>
                            </div>
                            <div class="col-5">
                                <label class="form-label small mb-1">Price *</label>
                                <input type="number" class="form-control" th:field="*{price}"
                                       step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small mb-1">Stock</label>
                                <input type="number" class="form-control" th:field="*{stock}" min="0" step="1">
                            </div>
                            <div class="col-6">
                                <label class="form-label small mb-1">Low-stock alert</label>
                                <input type="number" class="form-control" th:field="*{lowStockThreshold}" min="0" step="1">
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="bi bi-save"></i> Save
                            </button>
                            <a href="/inventory" class="btn btn-outline-secondary">Reset</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- ============ Product list ============ -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex align-items-center gap-2">
                    <form class="d-flex gap-2 flex-fill" method="get" action="/inventory">
                        <input type="text" class="form-control" name="q" th:value="${query}"
                               placeholder="Search barcode / name / category…">
                        <button class="btn btn-outline-primary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Barcode</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th class="text-end">Price</th>
                            <th class="text-center">Stock</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td><code th:text="${p.barcode}">SKU</code></td>
                            <td th:text="${p.name}">Name</td>
                            <td><span class="badge text-bg-light" th:text="${p.category}">Cat</span></td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(p.price, 1, 2)}">0.00</td>
                            <td class="text-center">
                                    <span class="badge stock-badge"
                                          th:classappend="${p.stock <= p.lowStockThreshold} ? 'low' : 'ok'"
                                          th:text="${p.stock}">0</span>
                            </td>
                            <td class="text-end">
                                <div class="btn-group btn-group-sm" role="group">
                                    <form th:action="@{/inventory/stock/{id}(id=${p.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="delta" value="-1">
                                        <button type="submit" class="btn btn-outline-secondary" title="Remove 1">
                                            &minus;
                                        </button>
                                    </form>
                                    <form th:action="@{/inventory/stock/{id}(id=${p.id})}" method="post" class="d-inline">
                                        <input type="hidden" name="delta" value="1">
                                        <button type="submit" class="btn btn-outline-secondary" title="Add 1">+</button>
                                    </form>
                                    <a class="btn btn-outline-primary" th:href="@{/inventory/edit/{id}(id=${p.id})}">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <form th:action="@{/inventory/delete/{id}(id=${p.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Deactivate this product?')">
                                        <button type="submit" class="btn btn-outline-danger">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                <i class="bi bi-inbox" style="font-size:1.5rem;"></i>
                                <p class="mb-0 mt-2">No products yet — create the first one on the left.</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Barcode scanner support: a scan ends with Enter. In the barcode field,
    // that must jump to the next field instead of submitting the form.
    (function () {
        var bc = document.getElementById("barcode");
        var name = document.getElementById("name");
        if (!bc) return;
        bc.addEventListener("keydown", function (e) {
            if (e.key === "Enter") { e.preventDefault(); if (name) name.focus(); }
        });
        if (!bc.value) bc.focus();   // new product: ready to scan straight away
    })();
</script>
</body>
</html>
