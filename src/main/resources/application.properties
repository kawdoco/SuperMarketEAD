# =====================================================================
# POS Terminal Application -- Spring Boot 3 / Java 17 / SQLite
# Local file storage, offline-capable, tuned for 2-4 GB RAM legacy boxes.
# =====================================================================

# ---------------------------------------------------------------------------
# SQLite local file-based storage (relative to the working directory)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:data/pos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Single-writer file DB: keep the pool tiny and connections short-lived.
spring.datasource.hikari.pool-name=POSSQLitePool
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=2000

# ---------------------------------------------------------------------------
# JPA / Hibernate -- SQLite via the Hibernate Community Dialect
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Logging: keep the terminal quiet, essentials + warnings only
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.pos=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ---------------------------------------------------------------------------
# Embedded Tomcat: minimal thread pool for a single-terminal workload
# ---------------------------------------------------------------------------
server.port=8080
server.address=127.0.0.1

server.tomcat.threads.max=4
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=2
server.tomcat.connection-timeout=5000

# Tiny async pool for AJAX work (checkout / hardware I/O).
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=2
spring.task.execution.pool.queue-capacity=4
spring.task.execution.thread-name-prefix=pos-async-

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
app.name=pos-terminal
app.version=1.0.0
# Set to false to disable receipt printing / drawer pulses (e.g. demo mode).
app.hardware.enabled=true
# Cash drawer trigger: ALL = open on every finalized bill (cash or card),
#                      CASH = open only for cash sales.
app.hardware.drawer-open-on=ALL
